<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tacklebox for Android</title>
<style>
  :root{--bg:#0E1A1E;--surface:#15272D;--ink:#F3EEE4;--muted:#9BB0B3;--brass:#C9A24B;--brass-soft:#E2C890}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .eyebrow{color:var(--brass);letter-spacing:.16em;text-transform:uppercase;font-size:13px;font-weight:700;margin:0 0 12px}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:44px;margin:0 0 10px;font-weight:600}
  p{color:var(--muted);max-width:44ch;margin:0 auto 26px}
  a.btn{display:inline-block;background:var(--brass);color:var(--bg);text-decoration:none;
    font-weight:600;padding:12px 22px;border-radius:999px}
  a.link{color:var(--brass-soft);display:block;margin-top:18px;font-size:14px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Tacklebox for Android</p>
  <h1>A private fishing journal</h1>
  <p>Offline-first. No accounts, no tracking, no ads — your waters and catches stay on your device.</p>
  <a class="btn" href="./privacy/">Privacy Policy</a>
  <a class="link" href="https://github.com/Stumyatt76/tacklebox-android">View the source on GitHub</a>
</main>
</body>
</html>
