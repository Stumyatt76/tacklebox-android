name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish a signed release for (e.g. v1.1). Defaults to the ref the workflow runs on.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & publish signed release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — add the signing secrets before tagging a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release (APK + AAB)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Name release artifacts
        id: artifacts
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          version="${TAG#v}"                        # v1.6 -> 1.6
          apk="tacklebox-${version}.apk"
          aab="tacklebox-${version}.aab"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cp app/build/outputs/bundle/release/app-release.aab "$aab"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"

      - name: Publish artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          APK: ${{ steps.artifacts.outputs.apk }}
          AAB: ${{ steps.artifacts.outputs.aab }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Tacklebox $TAG" --generate-notes
          gh release upload "$TAG" "$APK" "$AAB" --clobber

      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@v7
        with:
          name: tacklebox-release
          path: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.aab }}
          if-no-files-found: error
