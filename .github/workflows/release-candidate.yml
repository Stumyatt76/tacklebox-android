name: Signed release candidate

on:
  workflow_dispatch:
  push:
    branches: [ 'codex/review-fixes-*' ]

permissions:
  contents: read

jobs:
  candidate:
    name: Test and build candidate without publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check source and unit tests
        run: |
          python3 scripts/check-product-identity.py
          bash scripts/check-license-headers.sh
          ./gradlew testDebugUnitTest lintDebug lintRelease --no-daemon
      - name: Decode existing upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed candidate
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TACKLEBOX_PLAY_BILLING_PUBLIC_KEY: ${{ vars.PLAY_BILLING_PUBLIC_KEY }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Save candidate and test evidence
        uses: actions/upload-artifact@v7
        with:
          name: tacklebox-release-candidate
          retention-days: 7
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-*.html
